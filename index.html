<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rescue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121212'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23D6A84B'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header class="app-header">
    <span class="brand" aria-hidden="true">Rescue</span>
    <div id="language-switch" class="lang-switch" role="group"></div>
  </header>

  <p id="storage-warning" class="storage-warning" role="alert" hidden></p>

  <!-- Every screen is one <section>. Only one is visible at a time (see js/app.js). -->
  <main id="app">
    <section id="screen-menu" class="screen" hidden></section>
    <section id="screen-setup" class="screen" hidden></section>
    <section id="screen-game" class="screen" hidden></section>
    <section id="screen-results" class="screen" hidden></section>
    <section id="screen-quizzes" class="screen" hidden></section>
    <section id="screen-editor" class="screen" hidden></section>
    <section id="screen-preview" class="screen" hidden></section>
  </main>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <noscript>Rescue needs JavaScript to run. / Rescue potřebuje ke spuštění JavaScript.</noscript>

  <!-- Order matters: translations and data first, then logic, then screens, then start-up. -->
  <script src="lang/cs.js"></script>
  <script src="lang/en.js"></script>
  <script src="data/preset-quizzes.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/game.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/ui-game.js"></script>
  <script src="js/ui-editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
